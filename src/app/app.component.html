<!-- app.component.html -->
<div class="container">
  <div *ngIf="!isLoggedIn" class="login-box">
    <button (click)="login()">Login with Microsoft</button>
  </div>

  <div *ngIf="isLoggedIn" class="user-box">
    <p>Welcome, {{ username }}</p>
    <button (click)="logout()">Logout</button>
  </div>
</div>

<app-table></app-table>
